server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx has no mime type for .webmanifest, so it was served as
    # application/octet-stream.
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # Easter egg pages (serve .html files without extension)
    location ~ ^/(admin|wp-login|teapot)$ {
        try_files $uri $uri.html =404;
    }

    # Unknown paths must return 404.
    #
    # This used to end in `/index.html`, the standard SPA history fallback — but
    # this site has no client-side router, only hash anchors. The fallback meant
    # every typo, every dead inbound link and every probe for a file that is not
    # deployed answered 200 with the full page. Search engines call that a soft
    # 404 and it costs crawl budget on a domain that has very few real URLs.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
