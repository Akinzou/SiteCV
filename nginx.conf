server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # This container sits behind the host nginx, which speaks plain http to it.
    # Left on, nginx would build redirects from what *it* sees and answer
    # https://yelon.pro/about.html with `Location: http://yelon.pro/about`,
    # costing a second hop through the host's http->https redirect. A relative
    # Location is resolved by the client against the original scheme and host.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx has no mime type for .webmanifest, so it was served as
    # application/octet-stream.
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # /about is reachable as /about (try_files) and would also answer at
    # /about.html, which is the same document at a second URL. Nothing links to
    # the .html form and the page's canonical points at /about, but collapsing
    # it here means the duplicate cannot be crawled into existence at all.
    # try_files resolves files internally without re-matching a location, so
    # this only catches requests that ask for .html directly.
    location = /about.html {
        return 301 /about;
    }

    # Easter egg pages (serve .html files without extension)
    location ~ ^/(admin|wp-login|teapot)$ {
        try_files $uri $uri.html =404;
    }

    # Unknown paths must return 404.
    #
    # This used to end in `/index.html`, the standard SPA history fallback — but
    # this site has no client-side router, only hash anchors. The fallback meant
    # every typo, every dead inbound link and every probe for a file that is not
    # deployed answered 200 with the full page. Search engines call that a soft
    # 404 and it costs crawl budget on a domain that has very few real URLs.
    # `$uri.html` serves the build-time static pages (/about) at a clean,
    # extensionless URL. It stays ahead of the =404 and behind the real-file
    # lookup, so nothing that already resolves changes behaviour.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
