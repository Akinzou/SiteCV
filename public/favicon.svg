<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff"/>
      <stop offset="100%" style="stop-color:#bf00ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="16" fill="#0a0a0f"/>

  <!-- Deer head - geometric minimalist -->
  <g fill="none" stroke="url(#cyber)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left antler -->
    <path d="M25 35 L32 20 M32 20 L28 12 M32 20 L38 15"/>
    <!-- Right antler -->
    <path d="M75 35 L68 20 M68 20 L72 12 M68 20 L62 15"/>
    <!-- Head outline -->
    <path d="M35 40 Q50 30 65 40 L62 55 Q50 75 38 55 Z"/>
    <!-- Ears -->
    <path d="M32 42 L25 35 L35 40"/>
    <path d="M68 42 L75 35 L65 40"/>
  </g>

  <!-- Eyes - glowing dots -->
  <circle cx="42" cy="48" r="3" fill="#00f0ff">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="58" cy="48" r="3" fill="#00f0ff">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Nose -->
  <circle cx="50" cy="62" r="2" fill="#bf00ff"/>

  <!-- Accent line -->
  <rect x="15" y="88" width="70" height="2" rx="1" fill="url(#cyber)" opacity="0.8"/>
</svg>
