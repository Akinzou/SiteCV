name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE_NAME: sitecv
  CONTAINER_NAME: sitecv

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }} .

      - name: Save Docker image
        run: |
          docker save ${{ env.IMAGE_NAME }} -o sitecv.tar

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload image to VPS
        run: |
          scp -P ${{ secrets.VPS_PORT }} sitecv.tar ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/

      - name: Deploy on VPS
        run: |
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            docker load -i ~/sitecv.tar
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker run -d -p 8080:80 --name ${{ env.CONTAINER_NAME }} --restart unless-stopped ${{ env.IMAGE_NAME }}
            rm ~/sitecv.tar
            echo "Container updated successfully!"
          EOF

      - name: Cleanup
        run: rm -f sitecv.tar
