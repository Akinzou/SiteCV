    <!-- Schema.org JSON-LD is generated from src/content/schema.ts and injected
         here at build time, so the entity graph and the visible copy come from
         one module and cannot drift. It used to be a literal block in this file
         and it did drift: it still listed four employers months after the
         Experience section was deleted from the page.

         It sits at the end of <body>, not in <head>. Google reads it in either
         place, but at ~9 kB it made up 36% of the document and pushed the first
         readable sentence past byte 14 000 of 25 000. A crawler that only looks
         at the head, or truncates early, saw a <title> followed by a wall of
         JSON and concluded the page had no content. -->
